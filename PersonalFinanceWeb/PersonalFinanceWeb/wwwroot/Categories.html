<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории — Управление финансами</title>
    <link rel="stylesheet" href="/css/Categories.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">Личные финансы</div>
            <nav class="sidebar-nav">
                <a href="/Categories.html" class="nav-link active">Категории</a>
                <a href="/ExpenseItems.html" class="nav-link">Статьи расходов</a>
                <a href="/Transactions.html" class="nav-link">Транзакции</a>
            </nav>
        </aside>

        <div class="content">
            <header class="page-header">
                <h1>Категории</h1>
                <button class="btn-primary" type="button">+ Добавить категорию</button>
            </header>

            <main class="page-body">
                <div class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Название</th>
                                <th style="width: 180px; text-align: right;">Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="item-name">Питание</td>
                                <td>
                                    <div class="actions">
                                        <button class="btn-sm btn-edit" type="button">Изменить</button>
                                        <button class="btn-sm btn-delete" type="button">Удалить</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="item-name">Транспорт</td>
                                <td>
                                    <div class="actions">
                                        <button class="btn-sm btn-edit" type="button">Изменить</button>
                                        <button class="btn-sm btn-delete" type="button">Удалить</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="item-name">Жильё</td>
                                <td>
                                    <div class="actions">
                                        <button class="btn-sm btn-edit" type="button">Изменить</button>
                                        <button class="btn-sm btn-delete" type="button">Удалить</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="item-name">Развлечения</td>
                                <td>
                                    <div class="actions">
                                        <button class="btn-sm btn-edit" type="button">Изменить</button>
                                        <button class="btn-sm btn-delete" type="button">Удалить</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="item-name">Здоровье</td>
                                <td>
                                    <div class="actions">
                                        <button class="btn-sm btn-edit" type="button">Изменить</button>
                                        <button class="btn-sm btn-delete" type="button">Удалить</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
